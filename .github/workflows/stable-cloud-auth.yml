name: Stable cloud auth gate

on:
  push:
    branches:
      - main
      - repair/stable-cloud-auth-20260830
    paths:
      - 'index.html'
      - 'cloud-operator-session.js'
      - 'voice-welcome.js'
      - '.github/workflows/stable-cloud-auth.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript and load-order checks
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do node --check "$file"; done
          grep -F 'cloud-operator-session.js?v=20260830-stable1' index.html
          if grep -F 'document.write' voice-welcome.js; then
            echo 'Dynamic document loading is not allowed in the authentication path'
            exit 1
          fi
          if grep -F 'core_bootstrap_admin_service' cloud-operator-session.js | grep -v 'core_bootstrap_admin_service_v2'; then
            echo 'The revoked bootstrap RPC is still active'
            exit 1
          fi

      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock puppeteer-core@24.16.0

      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/generator-auth-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/generator-auth-http.log
          exit 1

      - name: Desktop, tablet and mobile authentication smoke test
        shell: bash
        run: |
          cat > /tmp/generator-auth-smoke.cjs <<'NODE'
          const assert = require('assert');
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');

          const operator = {id:'00000000-0000-4000-8000-000000000001',name:'Operador Prueba',role:'admin',active:true,version:1};
          const viewports = [
            {name:'desktop',width:1366,height:768},
            {name:'tablet',width:768,height:1024},
            {name:'mobile',width:390,height:844}
          ];

          (async () => {
            const browser = await puppeteer.launch({
              headless:true,
              executablePath:process.env.CHROME_BIN || '/usr/bin/google-chrome',
              args:['--no-sandbox','--disable-setuid-sandbox']
            });

            for (const viewport of viewports) {
              const page = await browser.newPage();
              await page.setViewport({width:viewport.width,height:viewport.height,deviceScaleFactor:1});
              const errors=[];
              page.on('pageerror', error => errors.push(String(error)));
              await page.setRequestInterception(true);
              page.on('request', request => {
                const url=request.url();
                if (url.includes('/rpc/core_list_operators_service')) {
                  request.respond({status:200,contentType:'application/json',body:JSON.stringify({ok:true,bootstrapped:true,operators:[operator]})});
                } else if (/^https:\/\/(?:cdn\.jsdelivr\.net|cdn\.sheetjs\.com)/.test(url)) {
                  request.respond({status:200,contentType:'application/javascript',body:'window.XLSX=window.XLSX||{};'});
                } else if (url.startsWith('https://yvlayxmhcngdqribcmkh.supabase.co/')) {
                  request.respond({status:400,contentType:'application/json',body:'{"ok":false}'});
                } else {
                  request.continue();
                }
              });

              await page.goto(`http://127.0.0.1:4173/?gate=${viewport.name}`,{waitUntil:'domcontentloaded',timeout:15000});
              await page.waitForSelector('#pdtAuthOverlay',{visible:true,timeout:5000});
              await page.waitForFunction(() => window.__PDT_CLOUD_AUTH_READY__===true && document.querySelector('#pdtAuthOperator')?.options.length === 1,{timeout:5000});
              const state=await page.evaluate(() => {
                const overlay=document.querySelector('#pdtAuthOverlay');
                const card=document.querySelector('.pdt-auth-card')?.getBoundingClientRect();
                const scripts=[...document.scripts].map(script=>script.getAttribute('src')||'');
                return {
                  ready:window.__PDT_CLOUD_AUTH_READY__===true,
                  enabled:window.__PDT_CLOUD_AUTH_ENABLED__===true,
                  selected:document.querySelector('#pdtAuthOperator')?.selectedOptions?.[0]?.textContent,
                  loginEnabled:!document.querySelector('#pdtAuthEnter')?.disabled,
                  shellLocked:document.querySelector('.app-shell')?.getAttribute('aria-hidden')==='true',
                  overlayInteractive:overlay?.inert===false && getComputedStyle(overlay).pointerEvents!=='none',
                  directCloud:scripts.some(src=>src.startsWith('cloud-operator-session.js?v=20260830-stable1')),
                  obsoletePatch:scripts.some(src=>src.includes('secure-bootstrap-patch.js')),
                  cardFits:card && card.left>=0 && card.right<=innerWidth
                };
              });
              assert.deepStrictEqual(state,{ready:true,enabled:true,selected:'Operador Prueba · Admin',loginEnabled:true,shellLocked:true,overlayInteractive:true,directCloud:true,obsoletePatch:false,cardFits:true});

              await page.click('#pdtAuthNew');
              await page.waitForSelector('#pdtAuthCreate:not(.pdt-auth-hidden)',{timeout:3000});
              const create=await page.evaluate(() => ({
                admins:document.querySelector('#pdtAuthAdmin')?.options.length,
                bootstrapHidden:document.querySelector('#pdtAuthBootstrapFields')?.classList.contains('pdt-auth-hidden')
              }));
              assert.deepStrictEqual(create,{admins:1,bootstrapHidden:true});
              assert.deepStrictEqual(errors,[]);
              await page.close();
            }

            await browser.close();
            console.log('GENERATOR_CLOUD_AUTH_GATE_OK');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node /tmp/generator-auth-smoke.cjs
