name: Verify personalized TTS welcome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tts-welcome-audit.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add TTS welcome module and connect it
        shell: python
        run: |
          from pathlib import Path

          module = r'''(() => {
            'use strict';

            const STORAGE_KEY = 'generadorPDT.personName.v1';
            const $ = (selector, root = document) => root.querySelector(selector);
            const supported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
            const synth = supported ? window.speechSynthesis : null;
            let voices = [];

            function normalizeName(value) {
              return String(value ?? '').replace(/\s+/g, ' ').trim().slice(0, 60);
            }

            function escapeHtml(value) {
              return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
            }

            function refreshVoices() {
              if (!supported) return;
              try { voices = synth.getVoices() || []; } catch { voices = []; }
            }

            function pickVoice() {
              const score = voice => {
                const lang = String(voice?.lang || '').toLowerCase();
                const name = String(voice?.name || '').toLowerCase();
                let value = 100;
                if (lang === 'es-pa') value = 0;
                else if (lang === 'es-us') value = 5;
                else if (lang === 'es-mx') value = 8;
                else if (lang === 'es-419') value = 10;
                else if (lang === 'es-es') value = 12;
                else if (lang.startsWith('es')) value = 18;
                if (/natural|neural|google|microsoft/.test(name)) value -= 2;
                if (voice?.default) value -= 1;
                return value;
              };
              return voices.slice().sort((a, b) => score(a) - score(b))[0] || null;
            }

            function speakWelcome(name) {
              if (!supported) return false;
              refreshVoices();
              const utterance = new SpeechSynthesisUtterance(`Bienvenida ${name}`);
              const voice = pickVoice();
              utterance.lang = voice?.lang || 'es-PA';
              if (voice) utterance.voice = voice;
              utterance.rate = 1.02;
              utterance.pitch = 1;
              utterance.volume = 1;
              try {
                synth.cancel();
                synth.speak(utterance);
                return true;
              } catch {
                return false;
              }
            }

            function injectStyles() {
              const style = document.createElement('style');
              style.id = 'pdtWelcomeTtsStyles';
              style.textContent = `
                .pdt-welcome-overlay{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(5,10,18,.78);backdrop-filter:blur(8px)}
                .pdt-welcome-card{width:min(430px,94vw);padding:24px;border-radius:18px;background:var(--surface,#fff);color:var(--text,#222);border:1px solid var(--border,#dfe3e8);box-shadow:0 30px 90px rgba(0,0,0,.4)}
                .pdt-welcome-card h2{margin:0 0 6px;font-size:22px}.pdt-welcome-card p{margin:0 0 18px;color:var(--muted,#6c757d);font-size:12px;line-height:1.5}
                .pdt-welcome-card label{display:grid;gap:7px;font-size:12px;font-weight:750}.pdt-welcome-card input{width:100%;box-sizing:border-box;padding:12px 13px;border-radius:10px;border:1px solid var(--border,#dfe3e8);background:var(--surface,#fff);color:var(--text,#222);font:inherit}
                .pdt-welcome-card button{width:100%;margin-top:14px}.pdt-welcome-error{min-height:18px;margin-top:7px;color:#dc3545;font-size:11px}.pdt-welcome-support{margin-top:12px!important;font-size:10px!important}
                @media print{.pdt-welcome-overlay{display:none!important}}
              `;
              document.head.appendChild(style);
            }

            function openGate() {
              if ($('#pdtWelcomeOverlay')) return;
              const saved = normalizeName(localStorage.getItem(STORAGE_KEY));
              const overlay = document.createElement('div');
              overlay.id = 'pdtWelcomeOverlay';
              overlay.className = 'pdt-welcome-overlay';
              overlay.innerHTML = `
                <section class="pdt-welcome-card" role="dialog" aria-modal="true" aria-labelledby="pdtWelcomeTitle">
                  <h2 id="pdtWelcomeTitle">Bienvenida</h2>
                  <p>Ingresa tu nombre para iniciar. La aplicación usará la voz del dispositivo para darte la bienvenida.</p>
                  <label>Nombre
                    <input id="pdtPersonName" maxlength="60" autocomplete="name" value="${escapeHtml(saved)}" placeholder="Escribe tu nombre">
                  </label>
                  <div id="pdtWelcomeError" class="pdt-welcome-error" aria-live="polite"></div>
                  <button id="pdtEnterBtn" type="button">ENTRAR A LA APP</button>
                  <p class="pdt-welcome-support">${supported ? 'TTS disponible en este navegador.' : 'Este navegador no ofrece síntesis de voz; podrás usar la aplicación normalmente.'}</p>
                </section>`;
              document.body.appendChild(overlay);

              const input = $('#pdtPersonName');
              const button = $('#pdtEnterBtn');
              const enter = () => {
                const name = normalizeName(input?.value);
                if (!name) {
                  $('#pdtWelcomeError').textContent = 'Escribe tu nombre para continuar.';
                  input?.focus();
                  return;
                }
                try { localStorage.setItem(STORAGE_KEY, name); } catch {}
                speakWelcome(name);
                overlay.remove();
                document.documentElement.dataset.personName = name;
                document.dispatchEvent(new CustomEvent('person:welcome', {detail:{name, ttsSupported:supported}}));
                setTimeout(() => document.querySelector('[autofocus],#text-sn')?.focus(), 0);
              };
              button.addEventListener('click', enter);
              input.addEventListener('keydown', event => {
                if (event.key === 'Enter') { event.preventDefault(); enter(); }
              });
              setTimeout(() => { input?.focus(); if (saved) input?.select(); }, 0);
            }

            function boot() {
              injectStyles();
              refreshVoices();
              if (supported) {
                if (typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', refreshVoices);
                else if ('onvoiceschanged' in synth) synth.onvoiceschanged = refreshVoices;
              }
              openGate();
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, {once:true});
            else boot();

            window.PDTWelcomeTTS = {supported, speakWelcome, refreshVoices};
          })();
          '''
          Path('voice-welcome.js').write_text(module, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          tag = '<script src="voice-welcome.js?v=welcome-20260829"></script>'
          if 'voice-welcome.js' not in html:
              marker = '<script src="print-fix.js?v=20260828-3"></script>'
              if marker not in html:
                  raise SystemExit('No se encontró el punto de carga para el módulo de bienvenida')
              html = html.replace(marker, marker + '\n  ' + tag, 1)
          index.write_text(html, encoding='utf-8')

      - name: JavaScript syntax audit
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            echo "Checking $file"
            node --check "$file"
          done
          grep -F 'voice-welcome.js' index.html
          grep -F 'Bienvenida ${name}' voice-welcome.js

      - name: Install browser test dependency
        run: npm install --no-save puppeteer-core@24.16.0

      - name: Start local application
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pdt-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pdt-http.log
          exit 1

      - name: Chromium personalized welcome smoke test
        shell: bash
        run: |
          cat > /tmp/pdt-tts-test.cjs <<'NODE'
          const puppeteer = require(process.cwd() + '/node_modules/puppeteer-core');
          const assert = require('assert');
          (async () => {
            const browser = await puppeteer.launch({headless:true, executablePath:process.env.CHROME_BIN || '/usr/bin/google-chrome', args:['--no-sandbox','--disable-setuid-sandbox','--autoplay-policy=no-user-gesture-required']});
            const page = await browser.newPage();
            await page.evaluateOnNewDocument(() => {
              window.__spoken = [];
              class MockUtterance { constructor(text){ this.text=String(text||''); this.lang=''; this.voice=null; this.rate=1; this.pitch=1; this.volume=1; } }
              const mockSpeech = {getVoices:()=>[{name:'Mock Spanish Panama',lang:'es-PA',default:true}],speak:u=>window.__spoken.push(u.text),cancel:()=>{},addEventListener:()=>{}};
              Object.defineProperty(window,'SpeechSynthesisUtterance',{configurable:true,writable:true,value:MockUtterance});
              Object.defineProperty(window,'speechSynthesis',{configurable:true,get:()=>mockSpeech});
            });
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/?welcome-test=1',{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForSelector('#pdtWelcomeOverlay',{timeout:5000});
            await page.type('#pdtPersonName','Josue Parfait');
            await page.click('#pdtEnterBtn');
            await page.waitForFunction(()=>window.__spoken.includes('Bienvenida Josue Parfait'),{timeout:3000});
            const state=await page.evaluate(()=>({spoken:window.__spoken,name:document.documentElement.dataset.personName,overlay:!!document.querySelector('#pdtWelcomeOverlay'),supported:window.PDTWelcomeTTS?.supported}));
            assert.strictEqual(state.name,'Josue Parfait');
            assert.strictEqual(state.overlay,false);
            assert.strictEqual(state.supported,true);
            assert.strictEqual(errors.length,0,errors.join(' | '));
            console.log('PDT_TTS_WELCOME_OK',JSON.stringify(state));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/pdt-tts-test.cjs

      - name: Commit only after verification passes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html voice-welcome.js
          if git diff --cached --quiet; then
            echo "Personalized welcome already verified and published"
            exit 0
          fi
          git commit -m "Add verified personalized TTS welcome"
          git push
